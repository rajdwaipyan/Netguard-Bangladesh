name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python modules
        run: python -m py_compile netguard_bangladesh.py tests\test_discovery_engine.py tests\test_runtime_probes.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run Ruff safety checks
        run: ruff check --select E9,F63,F7,F82 netguard_bangladesh.py tests
